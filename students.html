<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧校园 · 学生管理</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --txt:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
    --accent:#4f8cff; --accent2:#22c55e; --warn:#f59e0b; --danger:#ef4444; --purple:#a78bfa;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.5;display:flex;height:100vh;overflow:hidden}

  .sidebar{width:212px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
  .logo b{font-size:15px;letter-spacing:.5px}
  .logo span{display:block;font-size:10px;color:var(--dim);font-weight:400}
  .nav{flex:1;overflow-y:auto;padding:8px 0}
  .nav .grp{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:1px;padding:12px 18px 5px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:var(--dim);text-decoration:none;font-size:13px;border-left:2px solid transparent;transition:.15s}
  .nav a:hover{background:var(--panel2);color:var(--txt)}
  .nav a.active{background:linear-gradient(90deg,rgba(79,140,255,.15),transparent);color:var(--txt);border-left-color:var(--accent)}
  .nav a .ic{width:16px;text-align:center;font-size:14px;opacity:.9}
  .nav a .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600}
  .side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .side-foot .av{width:28px;height:28px;border-radius:50%;background:var(--accent2);color:#04210f;display:flex;align-items:center;justify-content:center;font-weight:700}
  .side-foot small{display:block;color:var(--dim);font-size:11px}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:54px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .crumb{color:var(--dim);font-size:12px}
  .crumb a{color:var(--dim);text-decoration:none}
  .crumb a:hover{color:var(--accent)}
  .crumb b{color:var(--txt)}
  .search{flex:1;max-width:360px;margin-left:8px;position:relative}
  .search input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:7px 12px 7px 32px;border-radius:8px;font-size:12px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search::before{content:"🔍";position:absolute;left:10px;top:7px;font-size:12px;opacity:.6}
  .top-ico{width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .top-ico .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
  .top-ico.u{background:var(--accent);border:none;color:#fff;font-weight:700}

  .content{flex:1;overflow-y:auto;padding:18px 20px 40px}
  .page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
  .page-h h1{font-size:19px;font-weight:650}
  .page-h p{color:var(--dim);font-size:12px;margin-top:3px}
  .btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}

  /* toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar select,.toolbar .si{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:7px 11px;border-radius:8px;font-size:12px;outline:none}
  .toolbar select:focus{border-color:var(--accent)}
  .toolbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}

  /* table */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--panel2)}
  .av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:8px;vertical-align:middle;color:#fff}
  .st{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600}
  .st.on{background:rgba(34,197,94,.15);color:var(--accent2)}
  .st.pause{background:rgba(245,158,11,.15);color:var(--warn)}
  .st.hold{background:rgba(167,139,250,.15);color:var(--purple)}
  .st.grad{background:rgba(139,148,158,.18);color:var(--dim)}
  .op{color:var(--accent);font-size:12px;margin-right:10px;text-decoration:none}
  .op:hover{text-decoration:underline}
  .chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

  .pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:12px;color:var(--dim)}
  .pager .pg{display:flex;gap:6px}
  .pager .pg button{background:var(--bg);border:1px solid var(--line);color:var(--txt);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:12px}
  .pager .pg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pager .pg button:disabled{opacity:.4;cursor:not-allowed}

  /* drawer */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:21;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .dh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .dh .av{width:46px;height:46px;font-size:17px}
  .dh .x{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--dim);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
  .dh b{font-size:15px}
  .dh small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .tabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px}
  .tabs button{background:none;border:none;color:var(--dim);padding:11px 12px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  .dbody{flex:1;overflow-y:auto;padding:16px 18px}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
  .kv span{color:var(--dim)}
  .kv b{font-weight:600}
  .dsec{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
  .bars{display:flex;flex-direction:column;gap:10px}
  .bars .row{font-size:12px}
  .bars .row .top{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:4px}
  .bars .row .top b{color:var(--txt)}
  .progress{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .progress i{display:block;height:100%;border-radius:4px}
  .witem{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
  .witem .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .witem .t small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .empty{color:var(--dim);text-align:center;padding:30px;font-size:12px}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="mark">智</div>
    <div><b>智慧校园</b><span>Campus OS · v3.2</span></div>
  </div>
  <nav class="nav">
    <div class="grp">主控制台</div>
    <a href="index.html"><span class="ic">📊</span>数据总览</a>
    <a href="#"><span class="ic">✅</span>今日待办 <span class="badge">12</span></a>
    <div class="grp">业务管理</div>
    <a class="active" href="students.html"><span class="ic">🎓</span>学生管理</a>
    <a href="#"><span class="ic">📚</span>教务管理</a>
    <a href="#"><span class="ic">🏠</span>宿舍管理</a>
    <a href="#"><span class="ic">💳</span>一卡通 / 消费</a>
    <a href="#"><span class="ic">💰</span>财务缴费</a>
    <a href="#"><span class="ic">⚙️</span>资产设备</a>
    <div class="grp">协同</div>
    <a href="#"><span class="ic">📢</span>通知公告 <span class="badge">3</span></a>
    <a href="#"><span class="ic">🛡️</span>安全预警</a>
    <a href="#"><span class="ic">⚙</span>系统设置</a>
  </nav>
  <div class="side-foot">
    <div class="av">王</div>
    <div><b>王管理员</b><small>信息化办公室</small></div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="crumb"><a href="index.html">主控制台</a> / <b>学生管理</b></div>
    <div class="search"><input placeholder="搜索学号 / 姓名 / 班级…"></div>
    <div class="top-ico">🔔<span class="dot"></span></div>
    <div class="top-ico">✉️</div>
    <div class="top-ico u">王</div>
  </div>

  <div class="content">
    <div class="page-h">
      <div>
        <h1>学生管理</h1>
        <p>全校在校生 24,816 人 · 点击任意行查看详情</p>
      </div>
      <button class="btn">+ 新增学生</button>
    </div>

    <div class="toolbar">
      <select id="f-dept"><option value="">全部院系</option></select>
      <select id="f-grade">
        <option value="">全部年级</option>
        <option>2022 级</option><option>2023 级</option><option>2024 级</option><option>2025 级</option>
      </select>
      <select id="f-status">
        <option value="">全部状态</option>
        <option value="on">在读</option>
        <option value="pause">休学</option>
        <option value="hold">保留学籍</option>
        <option value="grad">已毕业</option>
      </select>
      <div class="sp">
        <span id="count">—</span>
        <button class="btn ghost" id="reset">重置</button>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr>
          <th style="width:36px"><input class="chk" id="all"></th>
          <th>学号</th><th>姓名</th><th>性别</th><th>院系</th><th>班级</th><th>状态</th><th>最近活跃</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pager">
        <span id="pinfo">—</span>
        <div class="pg" id="pg"></div>
      </div>
    </div>
  </div>
</main>

<!-- Drawer -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div class="av" id="d-av">?</div>
    <div><b id="d-name">—</b><small id="d-id">—</small></div>
    <button class="x" id="d-x">✕</button>
  </div>
  <div class="tabs">
    <button class="on" data-t="base">基本信息</button>
    <button data-t="att">考勤</button>
    <button data-t="pay">一卡通</button>
    <button data-t="warn">预警</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<script>
const DEPTS=['计算机学院','经济管理学院','机械工程','外国语学院','医学院','艺术设计'];
const CLASSES={};
const NAMES=['李思源','张宇','王梓涵','陈墨','赵欣','刘洋','孙悦','周航','吴桐','郑昊','冯雪','何磊','许文','邓超','曹颖','彭飞','萧然','唐果','韩冰','薛峰','阎良','余欢','蓝天','杜鹃'];
const GENDERS=['男','女'];
const STATUSES=[['on','在读'],['on','在读'],['on','在读'],['on','在读'],['pause','休学'],['hold','保留学籍'],['grad','已毕业']];
const COLORS=['#4f8cff','#a78bfa','#22c55e','#f59e0b','#ef4444','#06b6d4'];
const AV=['#4f8cff','#a78bfa','#22c55e','#f59e0b','#ef4444','#06b6d4'];

// generate deterministic fake data
function rng(seed){return ()=>{seed=(seed*9301+49297)%233280;return seed/233280;}}
const r=rng(42);
let students=[];
for(let i=0;i<64;i++){
  const d=DEPTS[Math.floor(r()*DEPTS.length)];
  const g=GENDERS[Math.floor(r()*2)];
  const st=STATUSES[Math.floor(r()*STATUSES.length)];
  const grade=2022+Math.floor(r()*4);
  const cls=grade+'级 '+['1','2','3','4'][Math.floor(r()*4)]+'班';
  const name=NAMES[i%NAMES.length];
  students.push({
    id:'2025'+(1000+i).toString(),
    name,gender:g,dept:d,cls,status:st[0],statusT:st[1],
    grade, dorm:(Math.floor(r()*20)+1)+'号楼 '+ (Math.floor(r()*600)+100),
    phone:'138****'+(1000+Math.floor(r()*9000)).toString().slice(0,4),
    email:'s'+ (1000+i)+'@campus.edu.cn',
    enroll:grade+'-09-01',
    active:['今天 08:12','昨天 21:03','3 天前','今天 07:40','本周一'][Math.floor(r()*5)],
    att:Math.round(82+r()*17),
    consume:Math.round(200+r()*1800),
    warns: r()>0.8 ? Math.floor(r()*3)+1 : 0
  });
}

const stMap={on:'on',pause:'pause',hold:'hold',grad:'grad'};
const tbody=document.getElementById('tbody');
const fDept=document.getElementById('f-dept');
DEPTS.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;fDept.appendChild(o);});

let page=1,pageSize=10,cur=[];
function filt(){
  const k=document.querySelector('.search input').value.trim().toLowerCase();
  const d=fDept.value,g=document.getElementById('f-grade').value,s=document.getElementById('f-status').value;
  return students.filter(x=>
    (!d||x.dept===d)&&(!g||x.grade+' 级'===g)&&(!s||x.status===s)&&
    (!k||x.name.toLowerCase().includes(k)||x.id.includes(k)||x.cls.toLowerCase().includes(k))
  );
}
function render(){
  cur=filt();
  const total=cur.length, pages=Math.max(1,Math.ceil(total/pageSize));
  if(page>pages)page=pages;
  const slice=cur.slice((page-1)*pageSize,page*pageSize);
  tbody.innerHTML=slice.map(x=>`
    <tr data-id="${x.id}">
      <td><input class="chk" onclick="event.stopPropagation()"></td>
      <td style="color:var(--dim)">${x.id}</td>
      <td><span class="av" style="background:${AV[x.dept.length%AV.length]}">${x.name[0]}</span>${x.name}</td>
      <td>${x.gender}</td><td>${x.dept}</td><td>${x.cls}</td>
      <td><span class="st ${stMap[x.status]}">${x.statusT}</span></td>
      <td style="color:var(--dim)">${x.active}</td>
      <td><a class="op" onclick="event.stopPropagation();openDrawer('${x.id}')">查看</a><a class="op" onclick="event.stopPropagation()">编辑</a></td>
    </tr>`).join('') || '<tr><td colspan="9" class="empty">无匹配学生</td></tr>';
  document.getElementById('count').textContent='共 '+total+' 人';
  document.getElementById('pinfo').textContent='第 '+(cur.length?((page-1)*pageSize+1):0)+'-'+Math.min(page*pageSize,total)+' / '+total+' 条';
  const pg=document.getElementById('pg');pg.innerHTML='';
  for(let i=1;i<=pages;i++){const b=document.createElement('button');b.textContent=i;b.className=i===page?'on':'';b.onclick=()=>{page=i;render();};pg.appendChild(b);}
}
['f-dept','f-grade','f-status'].forEach(id=>document.getElementById(id).onchange=()=>{page=1;render();});
document.querySelector('.search input').oninput=()=>{page=1;render();};
document.getElementById('reset').onclick=()=>{fDept.value='';document.getElementById('f-grade').value='';document.getElementById('f-status').value='';document.querySelector('.search input').value='';page=1;render();};
document.getElementById('all').onchange=e=>{tbody.querySelectorAll('.chk').forEach(c=>c.checked=e.target.checked);};

// drawer
const mask=document.getElementById('mask'),drawer=document.getElementById('drawer');
function openDrawer(id){const x=students.find(s=>s.id===id);if(!x)return;
  document.getElementById('d-av').textContent=x.name[0];
  document.getElementById('d-av').style.background=AV[x.dept.length%AV.length];
  document.getElementById('d-name').textContent=x.name;
  document.getElementById('d-id').textContent=x.id+' · '+x.dept;
  drawer.dataset.id=id;showTab('base');
  mask.classList.add('show');drawer.classList.add('show');
}
function closeDrawer(){mask.classList.remove('show');drawer.classList.remove('show');}
document.getElementById('d-x').onclick=closeDrawer;mask.onclick=closeDrawer;

const tabs=document.querySelectorAll('.tabs button');
tabs.forEach(t=>t.onclick=()=>{tabs.forEach(z=>z.classList.remove('on'));t.classList.add('on');showTab(t.dataset.t);});
function showTab(t){
  const x=students.find(s=>s.id===drawer.dataset.id);if(!x)return;
  const db=document.getElementById('dbody');
  if(t==='base'){
    db.innerHTML=`
      <div class="kv"><span>学号</span><b>${x.id}</b></div>
      <div class="kv"><span>姓名</span><b>${x.name}</b></div>
      <div class="kv"><span>性别</span><b>${x.gender}</b></div>
      <div class="kv"><span>院系</span><b>${x.dept}</b></div>
      <div class="kv"><span>班级</span><b>${x.cls}</b></div>
      <div class="kv"><span>学籍状态</span><b>${x.statusT}</b></div>
      <div class="kv"><span>宿舍</span><b>${x.dorm}</b></div>
      <div class="kv"><span>手机</span><b>${x.phone}</b></div>
      <div class="kv"><span>邮箱</span><b>${x.email}</b></div>
      <div class="kv"><span>入学日期</span><b>${x.enroll}</b></div>`;
  }else if(t==='att'){
    db.innerHTML=`<div class="dsec">本周考勤</div>
      <div class="kv"><span>出勤率</span><b style="color:${x.att>90?'var(--accent2)':'var(--warn)'}">${x.att}%</b></div>
      <div class="kv"><span>本月缺勤</span><b>${Math.round((100-x.att)/10*3)} 次</b></div>
      <div class="kv"><span>迟到</span><b>${Math.floor(r()*4)} 次</b></div>
      <div class="dsec">趋势（近 6 周）</div>
      <div class="bars"><div class="row"><div class="top"><span>第1周</span><b>${x.att-3}%</b></div><div class="progress"><i style="width:${x.att-3}%;background:var(--accent2)"></i></div></div>
      <div class="row"><div class="top"><span>第3周</span><b>${x.att-1}%</b></div><div class="progress"><i style="width:${x.att-1}%;background:var(--accent2)"></i></div></div>
      <div class="row"><div class="top"><span>第6周</span><b>${x.att}%</b></div><div class="progress"><i style="width:${x.att}%;background:var(--accent2)"></i></div></div></div>`;
  }else if(t==='pay'){
    const a=58,b=21,c=11,d=10;
    db.innerHTML=`<div class="dsec">本月一卡通消费</div>
      <div class="kv"><span>合计</span><b style="color:var(--accent)">¥${x.consume}</b></div>
      <div class="bars">
      <div class="row"><div class="top"><span>🍜 食堂餐饮</span><b>¥${Math.round(x.consume*a/100)}</b></div><div class="progress"><i style="width:${a}%;background:var(--accent)"></i></div></div>
      <div class="row"><div class="top"><span>🛒 超市</span><b>¥${Math.round(x.consume*b/100)}</b></div><div class="progress"><i style="width:${b}%;background:var(--purple)"></i></div></div>
      <div class="row"><div class="top"><span>📖 图书打印</span><b>¥${Math.round(x.consume*c/100)}</b></div><div class="progress"><i style="width:${c}%;background:var(--accent2)"></i></div></div>
      <div class="row"><div class="top"><span>其他</span><b>¥${Math.round(x.consume*d/100)}</b></div><div class="progress"><i style="width:${d}%;background:var(--warn)"></i></div></div></div>`;
  }else{
    if(x.warns===0){db.innerHTML='<div class="empty">✅ 无安全预警</div>';}
    else{db.innerHTML='<div class="dsec">待处置预警 '+x.warns+' 条</div>'+
      Array.from({length:x.warns}).map((_,i)=>`<div class="witem"><div class="dot" style="background:${i===0?'var(--danger)':'var(--warn)'}"></div><div class="t">${i===0?'夜间未归 · 连续 2 天':'一卡通异常消费'}<small>${i===0?'3号楼 '+x.dorm.split(' ')[1]:'中心食堂 · ¥'+Math.round(200+r()*300)}</small></div></div>`).join('');}
  }
}
tbody.onclick=e=>{const tr=e.target.closest('tr[data-id]');if(tr)openDrawer(tr.dataset.id);};
render();
</script>
</body>
</html>
